<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies Database - JavaScript Promises Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Movies Database</h1>
            <p>JavaScript Promises Demo with <code>then()</code>, <code>catch()</code>, and <code>finally()</code></p>
        </header>

        <div class="controls">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search movies..." class="search-input">
                <button id="searchBtn" class="btn primary">Search</button>
            </div>
            <button id="loadMoreBtn" class="btn secondary">Load More Movies</button>
        </div>

        <div class="status-panel">
            <div id="loadingIndicator" class="loading hidden">
                <div class="spinner"></div>
                <span>Loading movies...</span>
            </div>
            <div id="errorMessage" class="error hidden"></div>
            <div id="successMessage" class="success hidden"></div>
        </div>

        <div class="movies-container">
            <div id="moviesGrid" class="movies-grid"></div>
            <div id="pagination" class="pagination hidden"></div>
        </div>
    </div>

    <!-- Movie Details Modal -->
    <div id="movieModal" class="modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <button class="modal-close" id="closeModal">&times;</button>
            <div class="modal-body">
                <div class="modal-poster">
                    <img id="modalPoster" src="" alt="Movie Poster">
                </div>
                <div class="modal-info">
                    <h2 id="modalTitle"></h2>
                    <div class="modal-meta">
                        <span id="modalRating" class="modal-rating"></span>
                        <span id="modalDate" class="modal-date"></span>
                    </div>
                    <p id="modalOverview" class="modal-overview"></p>
                    <div class="modal-details">
                        <div class="detail-item">
                            <strong>Release Date:</strong>
                            <span id="modalReleaseDate"></span>
                        </div>
                        <div class="detail-item">
                            <strong>Vote Count:</strong>
                            <span id="modalVoteCount"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
